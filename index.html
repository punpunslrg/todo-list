<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css">
  <style>
    .completed {
      text-decoration: line-through;
      color: gray;
    }
  </style>
  <title>To do list</title>
</head>
<body class="min-h-screen bg-no-repeat bg-center bg-cover" style="background-image: url(./pics/background.jpg);">
  <div id="container" class="w-screen h-screen flex justify-center items-center">
    <div id="todo-app" class="border flex flex-col items-center w-[400px] h-auto py-10 px-7 rounded-2xl bg-white/40 backdrop-blur-none shadow-2xl">
      <h1 class="text-3xl font-bold">To-Do List</h1>
      <!-- input area -->
      <form id="input-area" class="w-full flex justify-between py-5 items-center">
        <input type="text" id="task-input" placeholder="Add a new taks.." class="border-2 p-3 rounded-3xl w-full mr-4 bg-white/60 backdrop-blur-none shadow-lg">
        <button type="submit" id="add-task-btn" class="flex justify-center items-center h-[50px] aspect-square rounded-full bg-white/60 backdrop-blur-none shadow-xl hover:bg-gray-200">
          <i class="fa-solid fa-plus"></i>
        </button>
      </form>
      <!-- todo-container -->
      <div id="todo-container" class="flex w-full rounded-2xl h-auto overflow-hidden relative">
        <ul id="task-list" class="w-full flex flex-col items-center z-10">
        </ul>
        <img id="empty-image" src="https://picsum.photos/id/20/400" alt="empty"
        class="rounded-2xl opacity-30 w-full h-[400px] absolute object-cover pointer-events-none hidden">
      </div>
    </div>
  </div>
</body>
<script src="./script.js"></script>
</html>
